[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Cardputer@^1.1.1
build_flags =
    ; shown in the advanced mode and the log; the release's version
    -DAPP_VERSION=\"0.1.0\"
    ; The USB-C port is taken over for the key, so no USB serial console.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
