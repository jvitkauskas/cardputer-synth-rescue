# Builds the firmware on every push and pull request; a tag vX.Y.Z (matching
# APP_VERSION in platformio.ini) also makes the GitHub release with the image.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # the platform, toolchain and libraries, for the next builds
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Version
        id: version
        run: |
          v=$(sed -n 's/.*APP_VERSION=\\"\([^\\]*\)\\".*/\1/p' platformio.ini)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME, but platformio.ini says APP_VERSION $v"
            exit 1
          fi

      - name: Build
        run: pio run

      - name: Package
        run: |
          mkdir dist
          cp .pio/build/cardputer-adv/firmware.factory.bin \
             "dist/synth-rescue-v${{ steps.version.outputs.version }}-cardputer-adv.bin"
          (cd dist && sha256sum *.bin > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: synth-rescue-v${{ steps.version.outputs.version }}
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Synth rescue $VERSION" --notes-file notes.md
